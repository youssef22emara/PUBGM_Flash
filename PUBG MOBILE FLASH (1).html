<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PUBG MOBILE FLASH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f9ff;--bg2:#ffffff;--ink:#0d2238;--mute:#4b6580;--pri:#1a8cf0;--pri2:#0b5fc0;--line:#cfe4f8;--chip:#e3f1ff;--shadow:0 10px 30px rgba(26,140,240,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--bg2:#12213a;--ink:#eaf4ff;--mute:#9db6d1;--pri:#3aa0ff;--pri2:#1a78d6;--line:#22395a;--chip:#17304f;--shadow:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0a1424;--bg2:#12213a;--ink:#eaf4ff;--mute:#9db6d1;--pri:#3aa0ff;--pri2:#1a78d6;--line:#22395a;--chip:#17304f;--shadow:0 10px 30px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,Tahoma,Arial,sans-serif;line-height:1.7;transition:background .3s,color .3s}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;text-decoration:none}
.brand img{width:40px;height:40px;border-radius:10px}
.tools{display:flex;gap:8px;align-items:center}
.btn-i{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;min-height:40px}
.btn-i:focus-visible,.dl:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.tswitch{direction:ltr;position:relative;width:62px;height:34px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg,#9bd3ff,#cfe9ff);cursor:pointer;padding:0;transition:background .3s}
.tswitch[aria-checked="true"]{background:linear-gradient(90deg,#16294a,#0b1630)}
.tswitch:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ffb300;color:#fff;transition:transform .35s cubic-bezier(.5,1.6,.5,1),background .3s}
.tswitch[aria-checked="true"] .knob{transform:translateX(28px);background:#5b6cff}
.knob svg{width:16px;height:16px}
.knob .ic-moon{display:none}
.tswitch[aria-checked="true"] .knob .ic-sun{display:none}
.tswitch[aria-checked="true"] .knob .ic-moon{display:block}
.dl.direct{background:#ffc928;color:#10243c}
.notice{background:var(--chip);color:var(--ink);text-align:center;font-size:.85rem;font-weight:600;padding:6px 12px;border-bottom:1px solid var(--line)}
.flag{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#dff0ff 0%,#8fd0ff 55%,#2f9bf5 100%);color:#08203a}
:root[data-theme="dark"] .hero{background:linear-gradient(160deg,#0d2b4d 0%,#12467d 55%,#1a78d6 100%);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(160deg,#0d2b4d 0%,#12467d 55%,#1a78d6 100%);color:#fff}}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:24px;padding:48px 0}
.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);line-height:1.1;margin:0 0 12px;font-weight:900}
.hero p{font-size:1.2rem;margin:0 0 24px;max-width:34ch;font-weight:600}
.hero .art{border-radius:20px;box-shadow:var(--shadow);width:100%}
.stores{display:flex;flex-wrap:wrap;gap:12px}
.dl{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:14px;background:#0d2238;color:#fff;font-weight:800;text-decoration:none;font-size:1.05rem;min-height:52px;transition:transform .15s}
.dl:hover{transform:translateY(-2px)}
.dl.alt{background:#fff;color:#0d2238}
.dl svg{width:22px;height:22px;flex:none}
.note{margin-top:14px;font-size:.9rem;opacity:.85}
section{padding:56px 0}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 8px;font-weight:900}
.sub{color:var(--mute);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;perspective:1200px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transform-style:preserve-3d;will-change:transform}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:17px 17px 0 0;transform:translateZ(20px)}
.card>div:not(.js-tilt-glare){padding:14px 18px 18px;transform:translateZ(45px)}
.card h3{margin:0 0 4px;font-size:1.2rem}
.card p{margin:0;color:var(--mute)}
.cta{background:var(--chip);text-align:center;border-block:1px solid var(--line)}
.cta .stores{justify-content:center}
.cta .dl{background:var(--pri);color:#fff}
.cta .dl.alt{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
.cta .dl.direct{background:#ffc928;color:#10243c;border:0}
.mq{overflow:hidden;padding:28px 0 40px;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:mqL 50s linear infinite}
html[dir="ltr"] .track{animation-name:mqR}
@keyframes mqL{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mqR{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.track .card{flex:none;width:300px;margin:0 12px;animation:sway 7s ease-in-out infinite alternate}
.track .card:nth-child(6n+2){animation-delay:-1.2s}
.track .card:nth-child(6n+3){animation-delay:-2.4s}
.track .card:nth-child(6n+4){animation-delay:-3.6s}
.track .card:nth-child(6n+5){animation-delay:-4.8s}
.track .card:nth-child(6n+6){animation-delay:-6s}
@keyframes sway{from{transform:perspective(900px) rotateY(-16deg) rotateX(2deg)}to{transform:perspective(900px) rotateY(16deg) rotateX(-2deg)}}
html[dir="rtl"] .card{direction:rtl;text-align:right}
html[dir="ltr"] .card{direction:ltr;text-align:left}
.guide{background:var(--bg2);border-block:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:780px;counter-reset:s}
.steps li{display:flex;gap:16px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;counter-increment:s}
.steps li:before{content:counter(s);flex:none;width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900}
.steps h3{margin:0 0 2px;font-size:1.15rem}
.steps p{margin:0 0 8px;color:var(--mute)}
.steps .dl{background:var(--pri);color:#fff;min-height:44px;padding:8px 16px;font-size:.95rem}
.steps .dl.direct{background:#ffc928;color:#10243c}
.tip{margin-top:18px;color:var(--mute);max-width:780px}
.vs{display:grid;gap:10px}
.vs-h,.vs-r{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:12px;align-items:center}
.vs-h{padding:0 16px;font-weight:900;color:var(--mute)}
.vs-h b:last-child{color:var(--pri)}
.vs-r{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.vs-l{display:flex;align-items:center;gap:10px;font-weight:800}
.vs-l svg{width:38px;height:38px;padding:9px;border-radius:10px;background:var(--chip);color:var(--pri);flex:none}
.vs-c{color:var(--mute)}
.vs-c.f{color:var(--ink);font-weight:600}
.co h3 a{color:inherit;text-decoration:none;border-bottom:2px solid var(--pri)}
.co h3 a:hover{color:var(--pri)}
@media(max-width:700px){.vs-h{display:none}.vs-r{grid-template-columns:1fr 1fr}.vs-l{grid-column:1/-1}.vs-c:before{display:block;content:attr(data-p);font-size:.75rem;font-weight:800;color:var(--pri)}}
.co{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.co article{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.co h3{margin:0 0 4px;font-size:1.1rem}
.co p{margin:0;color:var(--mute)}
.src{margin:24px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.src a{color:var(--pri);font-weight:600}
.small{font-size:.85rem;color:var(--mute);margin-top:14px}
@media(max-width:860px){.co{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.co{grid-template-columns:1fr}}
@media(max-width:560px){.track .card{width:250px}.steps li{padding:14px}}
@media(prefers-reduced-motion:reduce){.track,.track .card{animation:none}.mq{overflow-x:auto}}
footer{padding:28px 0;color:var(--mute);font-size:.85rem;text-align:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;padding:32px 0}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.brand span{display:none}.btn-i{padding:6px 10px}.dl{flex:1 1 100%;justify-content:center}section{padding:40px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<section class="guide"><div class="wrap">
 <h2 data-ar="طريقة تثبيت اللعبة (ملف XAPK)" data-en="How to install the game (XAPK file)"></h2>
 <p class="sub" data-ar="ملف اللعبة بصيغة XAPK ولا يُثبَّت بالضغط عليه مباشرة. اتبع الخطوات التالية باستخدام تطبيق File Manager Plus." data-en="The game file is an XAPK, so it can't be installed by simply tapping it. Follow these steps with the File Manager Plus app."></p>
 <ol class="steps">
  <li><div><h3 data-ar="نزّل ملف اللعبة" data-en="Download the game file"></h3><p data-ar="اضغط على زر التنزيل المباشر وانتظر حتى يكتمل تنزيل ملف XAPK." data-en="Tap the direct download button and wait for the XAPK file to finish downloading."></p><a class="dl direct" href="#" data-store="direct"><i data-lucide="download"></i><span data-ar="تنزيل مباشر" data-en="Direct download"></span></a></div></li>
  <li><div><h3 data-ar="نزّل تطبيق File Manager Plus" data-en="Get File Manager Plus"></h3><p data-ar="هو التطبيق الذي سنفتح به ملف XAPK ونثبّته. نزّله من جوجل بلاي." data-en="This is the app we'll use to open and install the XAPK file. Get it from Google Play."></p><a class="dl" href="#" data-store="fm"><i data-lucide="folder-open"></i><span data-ar="File Manager Plus على جوجل بلاي" data-en="File Manager Plus on Google Play"></span></a></div></li>
  <li><div><h3 data-ar="افتح مجلد التنزيلات" data-en="Open the Downloads folder"></h3><p data-ar="افتح File Manager Plus وادخل على مجلد Downloads، وستجد ملف PUBG MOBILE FLASH." data-en="Open File Manager Plus and go to the Downloads folder. You'll find the PUBG MOBILE FLASH file there."></p></div></li>
  <li><div><h3 data-ar="اضغط على الملف وثبّته" data-en="Tap the file and install"></h3><p data-ar="اضغط على ملف XAPK واختر Install. إذا ظهر طلب إذن، فعّل «السماح بالتثبيت من هذا المصدر» لتطبيق File Manager Plus ثم ارجع واضغط تثبيت." data-en="Tap the XAPK file and choose Install. If a permission prompt appears, enable “Allow from this source” for File Manager Plus, then go back and tap Install."></p></div></li>
  <li><div><h3 data-ar="افتح اللعبة" data-en="Open the game"></h3><p data-ar="بعد انتهاء التثبيت ستجد اللعبة في قائمة التطبيقات. افتحها وابدأ اللعب." data-en="When the installation finishes, the game will be in your app list. Open it and start playing."></p></div></li>
 </ol>
 <p class="tip" data-ar="لو فشل التثبيت: تأكد من وجود مساحة فارغة كافية على الهاتف، أو نزّل اللعبة من جوجل بلاي مباشرة." data-en="If the installation fails, make sure your phone has enough free space, or get the game directly from Google Play."></p>
</div></section>

<section><div class="wrap">
 <h2 data-ar="الفرق بين PUBG MOBILE و PUBG MOBILE FLASH" data-en="PUBG MOBILE vs PUBG MOBILE FLASH"></h2>

var T={ar:{lang:'English',dark:'الوضع الليلي',light:'الوضع الفاتح'},en:{lang:'العربية',dark:'Dark mode',light:'Light mode'}};
var LINKS={direct:'https://d.apkpure.com/b/XAPK/com.tencent.igfit?version=latest',android:'https://play.google.com/store/apps/details?id=com.tencent.igfit&pcampaignid=web_share',ios:'https://apps.apple.com/us/app/pubg-mobile-flash/id6740521489',fm:'https://play.google.com/store/apps/details?id=com.alphainventor.filemanager&pcampaignid=web_share'};
var root=document.documentElement,lang='ar',theme=null;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function isDark(){return theme?theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function render(){
 root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-ar]').forEach(function(el){el.textContent=el.getAttribute('data-'+lang)});
 /* الزر يعرض اللغة التي سينتقل إليها: علم اللغة المقابلة */
 var other=lang==='ar'?'en':'ar';
 document.getElementById('flag').innerHTML=FLAGS[other];
 document.getElementById('langtxt').textContent=T[lang].lang;
 var d=isDark();
 var tb=document.getElementById('theme');tb.setAttribute('aria-checked',String(d));tb.title=d?T[lang].light:T[lang].dark;tb.setAttribute('aria-label',tb.title);
 document.querySelectorAll('[data-store]').forEach(function(a){a.href=LINKS[a.dataset.store];if(a.dataset.store!=='direct'){a.target='_blank';a.rel='noopener'}});
}
document.getElementById('lang').onclick=function(){lang=lang==='ar'?'en':'ar';store('lang',lang);render()};
document.getElementById('theme').onclick=function(){theme=isDark()?'light':'dark';root.setAttribute('data-theme',theme);store('theme',theme);render()};
var sl=load('lang');if(sl==='en'||sl==='ar')lang=sl;
var st=load('theme');if(st==='dark'||st==='light'){theme=st;root.setAttribute('data-theme',st)}
render();
